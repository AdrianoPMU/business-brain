<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<style>
@font-face { font-family: "DM Sans"; font-weight: 400; src: url("node_modules/@fontsource/dm-sans/files/dm-sans-latin-400-normal.woff2"); }
@font-face { font-family: "DM Sans"; font-weight: 500; src: url("node_modules/@fontsource/dm-sans/files/dm-sans-latin-500-normal.woff2"); }
@font-face { font-family: "DM Sans"; font-weight: 600; src: url("node_modules/@fontsource/dm-sans/files/dm-sans-latin-600-normal.woff2"); }
@font-face { font-family: "DM Sans"; font-weight: 700; src: url("node_modules/@fontsource/dm-sans/files/dm-sans-latin-700-normal.woff2"); }
@font-face { font-family: "Cormorant Garamond"; font-weight: 600; src: url("node_modules/@fontsource/cormorant-garamond/files/cormorant-garamond-latin-600-normal.woff2"); }
@font-face { font-family: "Cormorant Garamond"; font-weight: 600; font-style: italic; src: url("node_modules/@fontsource/cormorant-garamond/files/cormorant-garamond-latin-600-italic.woff2"); }
:root {
  --ivory: hsl(15 36% 96%); --card: hsl(15 67% 99%); --cocoa: hsl(347 17% 20%); --cocoa-2: hsl(347 17% 28%);
  --rose: hsl(349 34% 46%); --rose-soft: hsl(8 41% 75%); --nude: hsl(11 45% 91%); --border: hsl(10 37% 87%);
  --muted: hsl(347 13% 32%); --gold: hsl(40 62% 58%); --green: hsl(150 38% 38%);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--ivory); font-family: "DM Sans", sans-serif; color: var(--cocoa); }
#bg { position: absolute; inset: 0; background: radial-gradient(1200px 800px at 20% 30%, hsl(15 50% 98%), var(--ivory) 70%); }
#logo { position: absolute; left: 90px; top: 64px; font-size: 26px; letter-spacing: 0.32em; font-weight: 400; }
#logo b { font-weight: 700; letter-spacing: 0.08em; margin-right: 0.35em; }
#logo i { font-style: normal; color: var(--gold); margin-left: 0.4em; }
#card { position: absolute; left: 1290px; top: 60px; width: 540px; height: 960px; border-radius: 36px; background: var(--nude);
        box-shadow: 0 30px 80px -20px hsl(347 30% 30% / .35), 0 0 0 1px var(--border); }
#stage { position: absolute; left: 90px; top: 150px; width: 1110px; height: 800px; display: flex; align-items: center; justify-content: center; }
.scene { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
         animation: sceneIn .45s ease-out both; }
@keyframes sceneIn { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
@keyframes up { from { opacity: 0; transform: translateY(22px); } to { opacity: 1; transform: none; } }
@keyframes pop { 0% { opacity: 0; transform: scale(.85); } 70% { opacity: 1; transform: scale(1.03); } 100% { opacity: 1; transform: scale(1); } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes strike { from { transform: scaleX(0); } to { transform: scaleX(1); } }
@keyframes fill { from { background: var(--card); } to { background: var(--rose); } }
@keyframes glow { 0%,100% { box-shadow: 0 0 0 0 hsl(349 34% 46% / 0); } 50% { box-shadow: 0 0 0 14px hsl(349 34% 46% / .14); } }
@keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(12px); } }
.a { animation: up .55s cubic-bezier(.2,.7,.2,1) both; }
.p { animation: pop .5s cubic-bezier(.2,.7,.2,1) both; }
.f { animation: fade .5s ease-out both; }
.kicker { color: var(--rose); font-weight: 700; font-size: 24px; letter-spacing: .22em; text-transform: uppercase; margin-bottom: 28px; }
.big { font-family: "Cormorant Garamond", serif; font-weight: 600; font-size: 108px; line-height: 1.02; }
.big2 { font-family: "Cormorant Garamond", serif; font-weight: 600; font-size: 84px; line-height: 1.05; }
.it { font-style: italic; color: var(--rose); }
.sub { font-size: 34px; color: var(--muted); margin-top: 30px; line-height: 1.35; max-width: 900px; }
.chip { display: inline-flex; align-items: center; gap: 14px; background: var(--card); border: 1.5px solid var(--border); border-radius: 999px;
        padding: 22px 40px; font-size: 38px; font-weight: 600; position: relative; margin: 14px; box-shadow: 0 10px 30px -18px hsl(347 30% 30% / .4); }
.chip .x { position: absolute; left: 26px; right: 26px; top: 50%; height: 4px; background: var(--rose); transform-origin: left; animation: strike .4s ease-out both; }
/* phone */
.phone { width: 430px; height: 780px; border-radius: 56px; background: var(--cocoa); padding: 16px; box-shadow: 0 40px 90px -30px hsl(347 30% 20% / .55); position: relative; }
.screen { width: 100%; height: 100%; border-radius: 42px; background: #fff; overflow: hidden; position: relative; display: flex; flex-direction: column; text-align: left; }
.sbar { height: 54px; display: flex; justify-content: space-between; align-items: center; padding: 0 30px; font-size: 18px; font-weight: 700; }
.thead { padding: 12px 22px 16px; border-bottom: 1px solid #eee; display: flex; align-items: center; gap: 14px; }
.avatar { width: 52px; height: 52px; border-radius: 50%; background: var(--rose-soft); display: grid; place-items: center; font-weight: 700; color: var(--cocoa); font-size: 22px; flex: none; }
.tname { font-weight: 700; font-size: 21px; } .tsub { font-size: 15px; color: #8a7a7e; }
.msgs { flex: 1; padding: 22px 18px; display: flex; flex-direction: column; gap: 14px; }
.b { max-width: 80%; padding: 15px 19px; border-radius: 24px; font-size: 20px; line-height: 1.3; }
.in { background: #efe9ea; align-self: flex-start; border-bottom-left-radius: 8px; }
.out { background: var(--rose); color: #fff; align-self: flex-end; border-bottom-right-radius: 8px; }
.meta { font-size: 16px; color: #9a8a8e; align-self: center; font-weight: 600; letter-spacing: .02em; }
.tag { display: inline-block; font-size: 15px; font-weight: 700; padding: 6px 12px; border-radius: 999px; background: var(--nude); color: var(--rose); }
.photo { width: 230px; height: 150px; border-radius: 20px; align-self: flex-start;
         background: linear-gradient(160deg, hsl(20 40% 80%), hsl(15 35% 68%)); position: relative; overflow: hidden; }
.photo::before, .photo::after { content: ""; position: absolute; top: 58px; width: 74px; height: 16px; border-radius: 50% 60% 30% 30%; background: hsl(15 30% 32% / .75); }
.photo::before { left: 30px; transform: rotate(-6deg); } .photo::after { right: 30px; transform: rotate(6deg) scaleX(-1); }
/* calendar */
.cal { background: var(--card); border: 1.5px solid var(--border); border-radius: 32px; padding: 34px 40px; box-shadow: 0 20px 60px -30px hsl(347 30% 30% / .45); }
.calrow { display: flex; align-items: center; gap: 14px; margin: 14px 0; }
.calrow .lbl { width: 190px; text-align: left; font-weight: 700; font-size: 24px; color: var(--muted); }
.day { width: 92px; height: 92px; border-radius: 20px; border: 1.5px solid var(--border); display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 18px; color: var(--muted); font-weight: 600; background: var(--card); }
.day.on { animation: fill .35s ease-out both; color: #fff; border-color: var(--rose); }
/* flow */
.flow { display: flex; align-items: center; gap: 18px; }
.node { width: 210px; padding: 30px 16px; border-radius: 28px; background: var(--card); border: 1.5px solid var(--border); font-size: 25px; font-weight: 700; line-height: 1.2; box-shadow: 0 16px 40px -26px hsl(347 30% 30% / .5); }
.node .ic { font-size: 46px; display: block; margin-bottom: 12px; }
.node.hot { border-color: var(--rose); animation: glow 1.6s ease-in-out infinite; }
.arrow { font-size: 40px; color: var(--rose-soft); font-weight: 700; }
.notif { width: 720px; background: hsl(0 0% 100% / .96); border-radius: 30px; padding: 26px 30px; display: flex; gap: 22px; align-items: center; text-align: left;
         box-shadow: 0 30px 70px -30px hsl(347 30% 20% / .5); border: 1px solid var(--border); }
.notif .app { width: 74px; height: 74px; border-radius: 20px; background: var(--rose); color: #fff; display: grid; place-items: center; font-size: 36px; flex: none; }
.notif .t1 { font-weight: 700; font-size: 28px; } .notif .t2 { font-size: 24px; color: var(--muted); margin-top: 4px; }
.stat { font-family: "Cormorant Garamond", serif; font-weight: 600; font-size: 230px; line-height: .9; color: var(--rose); }
.statlbl { font-size: 40px; font-weight: 700; margin-top: 34px; }
.pill { display: inline-flex; align-items: center; gap: 16px; padding: 26px 46px; border-radius: 999px; background: var(--cocoa); color: hsl(8 33% 92%); font-size: 40px; font-weight: 700; }
.btn { display: inline-flex; padding: 34px 70px; border-radius: 999px; background: var(--rose); color: #fff; font-size: 46px; font-weight: 700; box-shadow: 0 20px 50px -20px hsl(349 34% 46% / .7); animation: glow 1.8s ease-in-out infinite; }
.down { font-size: 70px; color: var(--rose); margin-top: 30px; animation: bob 1.2s ease-in-out infinite; }
.check { display: flex; align-items: center; gap: 22px; font-size: 44px; font-weight: 600; margin: 16px 0; text-align: left; }
.check .ok { width: 62px; height: 62px; border-radius: 50%; background: var(--rose); color: #fff; display: grid; place-items: center; font-size: 34px; flex: none; }
.cols { display: flex; gap: 34px; }
.col { width: 440px; border-radius: 32px; padding: 40px 36px; text-align: left; background: var(--card); border: 1.5px solid var(--border); }
.col h4 { font-size: 26px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); margin-bottom: 18px; }
.col p { font-size: 36px; font-weight: 600; line-height: 1.25; }
.col.us { background: var(--cocoa); color: hsl(8 33% 92%); border-color: var(--cocoa); } .col.us h4 { color: var(--rose-soft); }
.shield { width: 200px; height: 230px; background: var(--rose); clip-path: path("M100 0 L200 40 L200 120 C200 180 150 215 100 230 C50 215 0 180 0 120 L0 40 Z"); display: grid; place-items: center; color: #fff; font-family: "Cormorant Garamond", serif; font-size: 96px; font-weight: 600; margin-bottom: 30px; }
.bk-hero { height: 200px; background: linear-gradient(150deg, hsl(15 45% 88%), hsl(349 30% 78%)); display: flex; align-items: flex-end; padding: 22px; }
.bk-hero span { font-family: "Cormorant Garamond", serif; font-size: 40px; font-weight: 600; color: var(--cocoa); }
.row { display: flex; justify-content: space-between; align-items: center; padding: 16px 22px; border-bottom: 1px solid #f0e8e9; font-size: 20px; }
.search { margin: 18px; padding: 18px 22px; border-radius: 999px; background: #f3eff0; font-size: 21px; color: #6b5b60; }
.map { height: 250px; background: repeating-linear-gradient(35deg, #ece8e4 0 2px, #f6f3f0 2px 48px), linear-gradient(#f6f3f0, #f6f3f0); position: relative; }
.pin { position: absolute; left: 50%; top: 40%; width: 44px; height: 44px; background: var(--rose); border-radius: 50% 50% 50% 0; transform: translate(-50%,-50%) rotate(-45deg); box-shadow: 0 8px 18px -6px hsl(349 34% 30% / .6); }
.ig { width: 100%; }
.ig .h { display: flex; gap: 12px; align-items: center; padding: 14px 16px; }
.ig .img { height: 470px; background: linear-gradient(160deg, hsl(15 40% 86%), hsl(349 28% 70%)); position: relative; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding-top: 34px; gap: 12px; }
.ig .cap { background: #fff; padding: 10px 20px; border-radius: 999px; font-weight: 700; font-size: 22px; }
.ig .cta { display: flex; justify-content: space-between; padding: 16px 18px; background: #f6f1f2; font-weight: 700; font-size: 19px; }
.mini { position: absolute; right: 24px; bottom: 22px; width: 120px; height: 190px; border-radius: 18px; background: linear-gradient(hsl(15 30% 75%), hsl(347 20% 45%)); box-shadow: 0 10px 20px -8px #0005; }
.mini::before { content: ""; position: absolute; left: 36px; top: 34px; width: 48px; height: 58px; border-radius: 50%; background: hsl(20 35% 70%); }
.mini::after { content: ""; position: absolute; left: 18px; bottom: 0; width: 84px; height: 80px; border-radius: 40px 40px 0 0; background: hsl(349 25% 60%); }
.eq { display: flex; align-items: center; gap: 36px; font-size: 58px; font-weight: 700; line-height: 1.2; }
.eq .box { padding: 44px 52px; border-radius: 30px; background: var(--card); border: 1.5px solid var(--border); }
.eq .op { font-size: 70px; color: var(--rose); }
.lang { display: flex; gap: 8px; margin-left: auto; }
.lang span { padding: 6px 12px; border-radius: 999px; font-size: 14px; font-weight: 700; background: var(--nude); color: var(--rose); }
</style>
</head>
<body>
<div id="bg"></div>
<div id="logo"><b>PMU</b>ACADEMIA<i>✦</i></div>
<div id="card"></div>
<div id="stage"></div>
<script>
const d = (s) => `animation-delay:${s}s`;
const phone = (inner, extra = "") => `<div class="phone a" style="${d(0.05)}"><div class="screen">${extra}<div class="sbar"><span>${inner.time || "9:41"}</span><span>●●● ▮</span></div>${inner.html}</div></div>`;
const thread = (name, sub, msgs, time, head = "") => phone({ time, html: `<div class="thead"><div class="avatar">${name[0]}</div><div><div class="tname">${name}</div><div class="tsub">${sub}</div></div>${head}</div><div class="msgs">${msgs}</div>` });
const bub = (cls, txt, t) => `<div class="b ${cls} a" style="${d(t)}">${txt}</div>`;
const meta = (txt, t) => `<div class="meta f" style="${d(t)}">${txt}</div>`;
const title = (o) => `${o.k ? `<div class="kicker a" style="${d(0.05)}">${o.k}</div>` : ""}<div class="${o.size || "big"} a" style="${d(0.15)}">${o.t}</div>${o.t2 ? `<div class="${o.size || "big"} it a" style="${d(o.d2 ?? 0.9)}">${o.t2}</div>` : ""}${o.s ? `<div class="sub a" style="${d(o.ds ?? 1.2)}">${o.s}</div>` : ""}`;
const days = ["L", "M", "M", "J", "V", "S"];
const calrow = (lbl, on, t0, step = 0.12) => `<div class="calrow"><div class="lbl">${lbl}</div>${days.map((x, i) => `<div class="day ${on.includes(i) ? "on" : ""}" style="${on.includes(i) ? d(t0 + on.indexOf(i) * step) : ""}">${x}</div>`).join("")}</div>`;
const flow = (hot) => `<div class="flow">${[["📣", "Anuncio"], ["💬", "Respuesta en segundos"], ["💳", "Depósito"], ["✨", "Tu cabina"]].map(([ic, t], i) =>
  `${i ? `<div class="arrow a" style="${d(0.25 + i * 0.45)}">→</div>` : ""}<div class="node a ${hot && hot.includes(i) ? "hot" : ""}" style="${d(0.15 + i * 0.45)}"><span class="ic">${ic}</span>${t}</div>`).join("")}</div>`;
const scenes = {
  1: () => title({ k: "Para artistas de micropigmentación", t: "Tienes el talento.", t2: "Falta la agenda llena.", d2: 1.7 }),
  2: () => title({ t: "Dame 3 minutos.", s: "Si eres micropigmentadora en Estados Unidos, esto es para ti.", ds: 0.9 }),
  3: () => `<div class="kicker a" style="${d(0)}">Ya lo intentaste</div><div>${["Publicar diario", "Bajar precios", "Pagar anuncios"].map((t, i) => `<div class="chip a" style="${d(0.2 + i * 0.7)}">${t}<span class="x" style="${d(2.7 + i * 0.25)}"></span></div>`).join("<br>")}</div>`,
  4: () => `<div class="cal">${calrow("Esta semana", [0, 1, 2, 3, 4, 5], 0.3)}${calrow("La próxima", [2], 1.6)}</div><div class="sub a" style="${d(1.9)}">Semanas llenas y semanas vacías.</div>`,
  5: () => title({ t: "¿El problema", t2: "soy yo?", d2: 0.6 }),
  6: () => title({ t: "No eres tú.", s: "Y casi nunca son los anuncios.", ds: 1.0 }),
  7: () => title({ k: "El verdadero problema", t: "Lo que pasa después", t2: "de que te escribe.", d2: 0.9, size: "big2" }),
  8: () => thread("Clienta nueva", "Mensaje de texto", `${meta("Hoy 9:04 p. m.", 0.4)}${bub("in", "¡Hola! ¿Cuánto cuesta el microblading? 😊", 0.7)}<div style="flex:1"></div><span class="tag f" style="align-self:center;${d(1.6)}">Sin responder</span>`, "9:04"),
  9: () => thread("Clienta nueva", "Mensaje de texto", `${meta("Ayer 9:04 p. m.", 0.1)}${bub("in", "¡Hola! ¿Cuánto cuesta el microblading? 😊", 0.2)}${meta("Hoy 8:30 a. m.", 0.9)}${bub("out", "¡Hola! Perdón la demora, ¿sigues interesada?", 1.2)}<div style="flex:1"></div>${meta("Visto · sin respuesta", 2.6)}`, "8:30"),
  10: () => `<div class="notif a" style="${d(0.1)}"><div class="app">📅</div><div><div class="t1">Sábado 11:00 · Cejas</div><div class="t2">Sin depósito</div></div></div><div class="pill p" style="margin-top:40px;${d(1.6)}">No llegó</div>`,
  11: () => title({ t: "No te faltan clientas.", t2: "Te falta quien conteste en minutos.", d2: 1.3, size: "big2" }),
  12: () => `<div class="kicker a">El camino completo</div>${flow()}`,
  13: () => `${flow([1, 2])}<div class="sub a" style="${d(1.6)}">Respuesta en segundos, su precio y su depósito.</div>`,
  14: () => `<div class="notif p" style="${d(0.2)}"><div class="app">✦</div><div><div class="t1">Nueva cita: sábado 11:00</div><div class="t2">Ombré Powder Brows · Depósito pagado</div></div></div><div class="sub a" style="${d(1.2)}">Tú solo te enteras.</div>`,
  15: () => title({ k: "Resultados reales", t: "Los números." }),
  16: () => `<div class="kicker a">Del 29 de sep. al 28 de oct. de 2026</div><div class="stat p" style="${d(0.5)}">5</div><div class="statlbl a" style="${d(0.9)}">estudios que manejamos</div>`,
  17: () => `<div class="stat p" style="${d(0.2)}">199</div><div class="statlbl a" style="${d(0.6)}">personas interesadas</div><div class="pill p" style="margin-top:40px;${d(2.2)}">$10.46 cada una</div>`,
  18: () => `<div class="stat p" style="${d(0.2)};font-size:190px">~$15</div><div class="statlbl a" style="${d(0.6)}">al día de anuncios, por estudio</div><div class="sub f" style="${d(1.6)};font-size:28px">Detalles en pmuacademia.com/resultados</div>`,
  19: () => title({ k: "PMU Academia", t: "Sistema", t2: "Agenda Llena", d2: 0.6, s: "Lo hacemos todo por ti.", ds: 1.5 }),
  20: () => `<div style="display:flex;align-items:center;gap:60px"><div class="phone a"><div class="screen"><div class="sbar"><span>9:41</span><span>●●● ▮</span></div><div class="ig"><div class="h"><div class="avatar">T</div><div><div class="tname">Tu Estudio</div><div class="tsub">Patrocinado</div></div></div><div class="img"><span class="cap">cejas efecto polvo 👀</span><span class="cap">15 lugares este mes</span></div><div class="cta"><span>Más información</span><span>›</span></div></div></div></div><div style="text-align:left"><div class="big2 a" style="${d(0.5)}">Facebook<br>e Instagram</div><div class="sub a" style="${d(1.2)};margin-top:20px">Los hacemos y los manejamos.</div></div></div>`,
  21: () => `<div class="pill p" style="${d(0.25)};font-size:46px;padding:34px 60px"><span style="color:var(--gold)">✦</span> Presentadora creada con IA</div>`,
  22: () => `<div style="display:flex;align-items:center;gap:60px"><div class="phone a"><div class="screen"><div class="sbar"><span>9:41</span><span>●●● ▮</span></div><div class="ig"><div class="h"><div class="avatar">T</div><div><div class="tname">Tu Estudio</div><div class="tsub">Patrocinado</div></div></div><div class="img"><span class="cap">cejas efecto polvo 👀</span><div class="mini p" style="${d(0.7)}"></div></div><div class="cta"><span>Reserva tu cita</span><span>›</span></div></div></div></div><div style="text-align:left"><div class="big2 a" style="${d(0.5)}">Videos para<br>tus anuncios</div><div class="sub a" style="${d(1.3)};margin-top:20px">Sin que tengas que grabarte.</div></div></div>`,
  23: () => thread("Sofía · Tu Estudio", "Asistente con IA", `${meta("9:04 p. m.", 0.2)}${bub("in", "Hola, ¿cuánto cuesta el ombré?", 0.4)}${bub("out", "¡Hola! Soy Sofía, de Tu Estudio 😊 Este mes el ombré está en $397. ¿Te cuento cómo es?", 1.4)}${meta("Respondió al instante", 2.4)}`, "9:04"),
  24: () => thread("Sofía · Tu Estudio", "Asistente con IA", `${bub("in", "Así tengo mis cejas ahorita 👇", 0.3)}<div class="photo a" style="${d(0.8)}"></div>${bub("out", "¡Te quedaría precioso el ombré! ¿Te aparto el sábado a las 11?", 1.6)}${bub("in", "¡Sí! 🙌", 2.6)}`, "9:06", `<div class="lang f" style="${d(0.2)}"><span>ES</span><span>EN</span></div>`),
